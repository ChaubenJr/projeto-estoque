<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
    {% block styles %}{% endblock %}
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <!-- Logo completa, que aparece quando o menu está expandido -->
            <img src="{{ url_for('static', filename='img/Logo ITP.png') }}" alt="Logo ILP Systems" class="logo-full" height="80">
            
            <!-- CORREÇÃO APLICADA AQUI -->
            <!-- Logo ícone, que aparece quando o menu está recolhido. O nome do arquivo foi padronizado. -->
            <img src="{{ url_for('static', filename='img/logo_icon.png') }}" alt="Ícone ILP" class="logo-icon" height="40" style="display: none;">
        </div>
        
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link" href="{{ url_for('main.entrada') }}" data-bs-toggle="tooltip" data-bs-placement="right" title="Entradas">
                    <i class="bi bi-box-arrow-in-down me-2"></i><span>Entradas</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{{ url_for('main.saida') }}" data-bs-toggle="tooltip" data-bs-placement="right" title="Saídas">
                    <i class="bi bi-box-arrow-up me-2"></i><span>Saídas</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{{ url_for('main.estoque') }}" data-bs-toggle="tooltip" data-bs-placement="right" title="Estoque">
                    <i class="bi bi-bar-chart-fill me-2"></i><span>Saldo</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{{ url_for('main.movimentacao') }}" data-bs-toggle="tooltip" data-bs-placement="right" title="Movimentação">
                    <i class="bi bi-arrow-down-up me-2"></i><span>Movimentação</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{{ url_for('main.cadastro') }}" data-bs-toggle="tooltip" data-bs-placement="right" title="Cadastro">
                    <i class="bi bi-plus-square-fill me-2"></i><span>Cadastro</span>
                </a>
            </li>
        </ul>
    </aside>

    <main class="main-content">
        <header class="page-header">
            <button class="btn menu-toggle"><i class="bi bi-list"></i></button>
            <h2 class="h4 mb-0 text-dark">{% block page_title %}{% endblock %}</h2>
        </header>

        {% block content %}{% endblock %}
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="{{ url_for('static', filename='scripts/main.js') }}"></script>

    <script>
        $(document).ready(function() {
            $('.menu-toggle').on('click', function() {
                $('body').toggleClass('sidebar-collapsed');
            });

            const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
            const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl));
        });
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
