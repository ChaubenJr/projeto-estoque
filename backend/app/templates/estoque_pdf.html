<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Relatório de Estoque</title>
    <style>
        /* Estilos básicos para o PDF */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h2, h3 {
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h2>Relatório de Estoque de Embalagens</h2>
    <h3>Data: {{ data_local.strftime('%d/%m/%Y %H:%M:%S') }}</h3>
    
    <table>
        <thead>
            <tr>
                <th>Código</th>
                <th>Descrição</th>
                <th>Estoque Atual</th>
            </tr>
        </thead>
        <tbody>
            {% for i in estoque_total_embalagens %}
            <tr>
                <td>{{ i[0] }}</td>
                <td>{{ i[1] }}</td>
                <td>{{ i[2] }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="3">Nenhum dado de estoque encontrado.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
