{% extends 'base.html' %}

{% block title %}Registro de Saídas{% endblock %}

{% block page_title %}Registro de Saída{% endblock %}

{% block content %}
    <div class="card shadow-sm">
        <div class="card-header">
            <h3 class="h5 mb-0">Formulário de Saída</h3>
        </div>
        <div class="card-body p-4">
            <form action="{{ url_for('main.saida_embalagem') }}" method="POST">
                
                <div class="row mb-4 mt-3">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Código do Produto</label>
                        <select class="form-select" id="cod_produto_embalagem" name="cod_produto_embalagem" required>
                            </select>
                    </div>
                    <div class="col-md-8 mb-3">
                        <label class="form-label">Descrição do Produto</label>
                        <input type="text" class="form-control" id="nomeProduto" readonly>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">OP</label>
                        <input type="text" class="form-control" id="op" name="op" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Quantidade</label>
                        <div class="number-input-wrapper">
                            <input type="number" class="form-control" id="quantidade" name="quantidade" required>
                            <div class="number-input-arrows">
                                <span class="arrow-up"></span>
                                <span class="arrow-down"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Responsável</label>
                        <input type="text" class="form-control" name="responsavel_saida" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Data</label>
                        <input type="date" class="form-control" name="data_saida" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Hora</label>
                        <input type="time" class="form-control" name="hora_saida" required value="00:00">
                    </div>
                </div>

                <div class="d-flex justify-content-center mt-4" style="gap: 1rem;">
                    <button type="submit" class="btn btn-custom-primary">
                        <i class="bi bi-check-lg"></i> Registrar Saída
                    </button>
                    <a href="{{ url_for('main.registro_diario_saidas') }}" class="btn btn-custom-secondary">
                        <i class="bi bi-calendar-event"></i> Ver Registro Diário
                    </a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}


{% block scripts %}
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    
    <script>
        const produtosData = {{ produtos_para_template | tojson | safe }};
    </script>

    <script src="{{ url_for('static', filename='scripts/saida.js') }}"></script>
    
    <script>
        $(document).ready(function() {
            document.querySelectorAll('.number-input-wrapper').forEach(wrapper => {
                const input = wrapper.querySelector('input[type="number"]');
                const arrowUp = wrapper.querySelector('.arrow-up');
                const arrowDown = wrapper.querySelector('.arrow-down');
                if (input && arrowUp && arrowDown) {
                    arrowUp.addEventListener('click', () => { input.stepUp(); input.dispatchEvent(new Event('change')); });
                    arrowDown.addEventListener('click', () => { input.stepDown(); input.dispatchEvent(new Event('change')); });
                }
            });
        });
    </script>
{% endblock %}
