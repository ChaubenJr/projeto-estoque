<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Saída de Embalagens</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
</head>
<body class="fundo-imagem">

    <nav class="navbar navbar-expand-lg" data-bs-theme="dark">
        <div class="container justify-content-between align-items-center">
            <a class="navbar-brand" href="{{ url_for('main.index') }}">
                <img src="{{ url_for('static', filename='img/Logo ITP.png') }}" alt="Logo da Empresa" height="80">
            </a>
            
            <div class="navbar-custom">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('main.entrada') }}">Entradas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for('main.saida') }}">Saídas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('main.estoque') }}">Estoque</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
    <div class="container mt-5">
        <div class="card shadow text-white main-card">
            <div class="card-body">
                <h4 class="card-title text-center">Registro de Saída de Embalagens</h4>
                <form action="{{ url_for('main.saida_embalagem') }}" method="POST">
                    
                    <div class="row mb-4 mt-5">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Código do Produto</label>
                            <select class="form-select" id="cod_produto_embalagem" name="cod_produto_embalagem" required>
                                <option selected>Selecione...</option>
                            </select>
                        </div>
                        <div class="col-md-8 mb-3">
                            <label class="form-label">Descrição do Produto</label>
                            <input type="text" class="form-control" id="nomeProduto" readonly>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">OP</label>
                            <input type="text" class="form-control" id="op" name="op" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Quantidade</label>
                            <div class="number-input-wrapper">
                                <input type="number" class="form-control" id="quantidade" name="quantidade" required>
                                <div class="number-input-arrows">
                                    <span class="arrow-up"></span>
                                    <span class="arrow-down"></span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Responsável</label>
                            <input type="text" class="form-control" id="responsavel_saida" name="responsavel_saida" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Data</label>
                            <input type="date" class="form-control" id="data_saida" name="data_saida" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-center mt-5" style="gap: 1rem;">
                        <button type="submit" class="btn btn-custom-primary">
                            <i class="bi bi-check-lg"></i> Registrar Saída
                        </button>
                        <a href="{{ url_for('main.registro_diario_saidas') }}" class="btn btn-custom-secondary">
                            <i class="bi bi-calendar-event"></i> Ver Registro Diário
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <script>
        const produtosData = {{ produtos_para_template | tojson | safe }};
    </script>
    <script src="{{ url_for('static', filename='scripts/main.js') }}"></script>

    <script>
        $(document).ready(function() {
            // 1. INICIALIZA O SELECT2 PARA ATIVAR A BUSCA
            $('#cod_produto_embalagem').select2();

            // 2. ADICIONA A FUNCIONALIDADE DE CLIQUE ÀS SETAS CUSTOMIZADAS
            document.querySelectorAll('.number-input-wrapper').forEach(wrapper => {
                const input = wrapper.querySelector('input[type="number"]');
                const arrowUp = wrapper.querySelector('.arrow-up');
                const arrowDown = wrapper.querySelector('.arrow-down');

                if (input && arrowUp && arrowDown) {
                    arrowUp.addEventListener('click', () => {
                        input.stepUp();
                        input.dispatchEvent(new Event('change'));
                    });

                    arrowDown.addEventListener('click', () => {
                        input.stepDown();
                        input.dispatchEvent(new Event('change'));
                    });
                }
            });
        });
    </script>

</body>
</html>
