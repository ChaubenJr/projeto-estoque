<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Estoque</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
</head>
<body class="fundo-imagem">
    <nav class="navbar navbar-expand-lg" data-bs-theme="dark">
        <div class="container justify-content-between align-items-center">
            <a class="navbar-brand" href="{{ url_for('main.index') }}">
                <img src="{{ url_for('static', filename='img/Logo ITP.png') }}" alt="Logo da Empresa" height="80">
            </a>

            <div class="navbar-custom">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for('main.entrada') }}">Entradas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('main.saida') }}">Saídas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('main.estoque') }}">Estoque</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-5">
        <div class="card shadow text-white main-card">
            <div class="card-body">
                <h4 class="card-title text-center">Registro de Embalagens</h4>
                <form action="{{ url_for('main.entrada_embalagem') }}" method="POST">
                    
                    <div class="row mb-4 mt-5">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Código do Produto</label>
                            <select class="form-select" id="cod_produto_embalagem" name="cod_produto_embalagem">
                                <option selected>Selecione...</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Descrição do Produto</label>
                            <input type="text" class="form-control" id="nomeProduto" readonly>
                        </div>
                        <div class="col-md-2 mb-3">
                            <label class="form-label">Unidade de Medida</label>
                            <input type="text" class="form-control" id="und" readonly>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Nota Fiscal</label>
                            <input type="text" class="form-control" id="nf" name="nf">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Padrão de Embalagem</label>
                            <input type="text" class="form-control" id="padraoProduto" readonly>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Quantidade Recebida</label>
                            <input type="number" class="form-control" id="quantidade_recebida" name="quantidade_recebida">
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Responsável pelo Recebimento</label>
                            <input type="text" class="form-control" id="responsavel_recebimento" name="responsavel_recebimento">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Data do Recebimento</label>
                            <input type="date" class="form-control" id="data_recebimento" name="data_recebimento">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Valor Total</label>
                            <input type="number" step="0.01" class="form-control" id="total" name="total">
                        </div>
                    </div>

                    <div class="d-flex justify-content-center mt-5">
                        <button type="submit" class="btn btn-sm me-2" style="background-color: rgb(0, 151, 100)" data-bs-theme="dark">Registrar Entrada</button>
                        <button type="button" class="btn btn-secondary btn-sm">Ver Registro Diário</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <!-- Passa os dados dos produtos do Flask (Python) para o JavaScript -->
    <script>
        const produtosData = {{ produtos_para_template|tojson }};
    </script>
    <script src="{{ url_for('static', filename='scripts/main.js') }}"></script>
</body>
</html>
