<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Estoque</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/backend/app/static/main.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg examplo-da-classe" text-white data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('main.index') }}">
                <img src="/backend/app/static/img/Logo ITP.png" alt="Logo da Empresa" height="70">
            </a>
            <div class="ms-auto">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="entrada.html">Entradas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="saida.html">Saídas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="estoque.html">Estoque</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
    <div class="container mt-5">
        <div class="card shadow text-white">
            <div class="card-body" style="background-color:rgb(2, 33, 56);">
                <h4 class="card-title text-center">Registro de Saida de Embalagens</h4>
                <form action="{{ url_for('main.saida_embalagem') }}" method="POST">
                    
                    <div class="row mb-4 mt-5">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Código do Produto</label>
                            <select class="form-select" id="cod_produto_embalagem" name="cod_produto_embalagem">
                                <option selected>Selecione...</option>
                            </select>
                        </div>
                        <div class="col-md-8 mb-3">
                            <label class="form-label">Descrição do Produto</label>
                            <input type="text" class="form-control" id="nomeProduto" readonly>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">OP</label>
                            <input type="text" class="form-control" id="op" name="op">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Quantidade</label>
                            <input type="number" class="form-control" id="quantidade_saida" name="quantidade_saida">
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Responsável</label>
                            <input type="text" class="form-control" id="responsavel_saida" name="responsavel_saida">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Data</label>
                            <input type="date" class="form-control" id="data_saida" name="data_saida">
                        </div>
                    </div>

                    <div class="d-flex justify-content-center mt-5">
                       <button type="submit" class="btn btn-sm me-2" style="background-color: rgb(0, 151, 100)" data-bs-theme="dark">Registrar Entrada</button>
                        <button type="button" class="btn btn-secondary btn-sm">Ver Registro Diário</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="/backend/app/static/scripts/main.js"></script>
</body>
</html>
