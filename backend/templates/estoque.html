<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Estoque</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg" style="background-color:rgb(2, 33, 56);" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('main.index') }}">
                <img src="logo.png" alt="Logo da Empresa" height="40">
            </a>
            <div class="ms-auto">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/backend/app/templates/entrada.html">Entradas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="saida.html">Saídas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="estoque.html">Estoque</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
    <div class="container mt-5">
        <div class="card shadow text-white" style="background-color:rgb(2, 33, 56);">
            <div class="card-body">
                <h4 class="card-title text-center">Registro de Embalagens</h4>
                <form action="{{ url_for('main.entrada_embalagem') }}" method="POST">
                    
                    <div class="row mb-4 mt-5">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Código do Produto</label>
                            <select class="form-select" id="cod_produto_embalagem" name="cod_produto_embalagem">
                                <option selected>Selecione...</option>
                                {% for produto in produtos %}
                                <option value="{{ produto.cod_produto_embalagem }}">{{ produto.cod_produto_embalagem }} - {{ produto.nome_produto }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-8 mb-3">
                            <label class="form-label">Nome do Produto</label>
                            <input type="text" class="form-control" id="nomeProduto" readonly>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Nota Fiscal</label>
                            <input type="text" class="form-control" id="nf" name="nf">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Padrão de Embalagem</label>
                            <input type="text" class="form-control" id="padraoProduto" readonly>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Quantidade Recebida</label>
                            <input type="number" class="form-control" id="quantidade_recebida" name="quantidade_recebida">
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Responsável pelo Recebimento</label>
                            <input type="text" class="form-control" id="responsavel_recebimento" name="responsavel_recebimento">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Data do Recebimento</label>
                            <input type="date" class="form-control" id="data_recebimento" name="data_recebimento">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Valor Total</label>
                            <input type="number" step="0.01" class="form-control" id="total" name="total">
                        </div>
                    </div>

                    <div class="d-flex justify-content-center mt-5">
                        <button type="submit" class="btn btn-sm me-2" style="background-color: rgb(0, 151, 100)" data-bs-theme="dark">Registrar Entrada</button>
                        <button type="button" class="btn btn-secondary btn-sm">Ver Registro Diário</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
